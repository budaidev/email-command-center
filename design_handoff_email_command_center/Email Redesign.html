<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email Command Center — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ---------- TOKENS: DARK (default) ---------- */
    --bg:          oklch(0.16 0.004 80);
    --surface:     oklch(0.195 0.005 80);
    --surface-2:   oklch(0.23 0.005 80);
    --surface-3:   oklch(0.27 0.005 80);
    --line:        oklch(0.28 0.005 80 / 0.9);
    --line-soft:   oklch(0.28 0.005 80 / 0.45);
    --text:        oklch(0.97 0.005 80);
    --text-2:      oklch(0.78 0.004 80);
    --text-3:      oklch(0.56 0.004 80);
    --text-4:      oklch(0.42 0.004 80);

    --accent:      oklch(0.72 0.14 250);
    --accent-soft: oklch(0.72 0.14 250 / 0.14);
    --accent-ink:  oklch(0.22 0.04 250);

    --danger:      oklch(0.68 0.18 25);
    --warn:        oklch(0.78 0.14 75);
    --ok:          oklch(0.72 0.13 155);
    --violet:      oklch(0.72 0.14 300);

    --accent-ai:       oklch(0.74 0.14 295);
    --accent-ai-soft:  oklch(0.74 0.14 295 / 0.16);
    --accent-ai-ink:   oklch(0.22 0.04 295);

    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);

    /* Density */
    --row-py: 12px;
    --row-px: 16px;
    --pane-px: 20px;
    --radius: 10px;
    --radius-sm: 6px;
  }

  :root[data-theme="light"] {
    --bg:          oklch(0.985 0.003 80);
    --surface:     oklch(1    0     0);
    --surface-2:   oklch(0.965 0.003 80);
    --surface-3:   oklch(0.935 0.004 80);
    --line:        oklch(0.88 0.004 80);
    --line-soft:   oklch(0.92 0.004 80);
    --text:        oklch(0.2  0.01  80);
    --text-2:      oklch(0.38 0.008 80);
    --text-3:      oklch(0.55 0.006 80);
    --text-4:      oklch(0.72 0.004 80);

    --accent:      oklch(0.55 0.16 250);
    --accent-soft: oklch(0.55 0.16 250 / 0.1);
    --accent-ink:  oklch(0.98 0     0);

    --accent-ai:       oklch(0.56 0.17 295);
    --accent-ai-soft:  oklch(0.56 0.17 295 / 0.1);
    --accent-ai-ink:   oklch(0.98 0     0);

    --shadow: 0 1px 2px rgba(15,17,21,.06), 0 8px 24px rgba(15,17,21,.06);
  }

  /* Density modifiers */
  :root[data-density="compact"]     { --row-py: 8px;  --row-px: 12px; --pane-px: 16px; }
  :root[data-density="comfortable"] { --row-py: 12px; --row-px: 16px; --pane-px: 20px; }
  :root[data-density="spacious"]    { --row-py: 18px; --row-px: 20px; --pane-px: 28px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    font-feature-settings: "cv11","ss01","ss03";
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace; font-feature-settings: "zero","ss01"; }
  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; letter-spacing: -0.01em; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  /* ---------- VARIATION SWITCHER ---------- */
  .variation-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 60;
    display: inline-flex; gap: 2px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .variation-bar button {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--text-2);
    transition: all .18s ease;
  }
  .variation-bar button[aria-selected="true"] {
    background: var(--text);
    color: var(--bg);
  }
  .variation-bar button:hover:not([aria-selected="true"]) {
    color: var(--text);
  }
  .variation-bar .vlabel {
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    line-height: 1;
    padding-right: 10px;
    padding-left: 12px;
    color: var(--text-3);
    font-style: italic;
  }

  .scene { height: 100vh; width: 100vw; display: none; }
  .scene.active { display: flex; }

  /* ---------- TWEAK PANEL ---------- */
  .tweak-panel {
    position: fixed; right: 20px; bottom: 20px;
    z-index: 70;
    width: 260px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: none;
    overflow: hidden;
  }
  .tweak-panel.open { display: block; }
  .tweak-header {
    padding: 12px 14px 8px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line-soft);
  }
  .tweak-header h3 {
    margin: 0; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-3);
  }
  .tweak-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
  .tweak-row label { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 6px; font-weight: 500; }
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 2px; padding: 2px;
    background: var(--surface-2);
    border-radius: 8px;
  }
  .seg button {
    padding: 6px 8px; font-size: 11px; color: var(--text-2);
    border-radius: 6px; transition: all .15s;
    font-weight: 500;
  }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .seg button:hover:not([aria-selected="true"]) { color: var(--text); }

  /* ---------- shared small bits ---------- */
  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; padding: 2px 5px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
    color: var(--text-3);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--line-soft);
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip.warn   { background: oklch(0.78 0.14 75 / 0.14); color: var(--warn); border-color: transparent; }
  .chip.ok     { background: oklch(0.72 0.13 155 / 0.14); color: var(--ok); border-color: transparent; }
  .chip.violet { background: oklch(0.72 0.14 300 / 0.14); color: var(--violet); border-color: transparent; }

  .icon { width: 16px; height: 16px; stroke-width: 1.75; }

  /* scrollbar */
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  .scroll::-webkit-scrollbar-thumb:hover { background: var(--text-4); background-clip: padding-box; border: 3px solid transparent; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* Focus */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>

<!-- Variation switcher -->
<nav class="variation-bar" aria-label="Variations">
  <span class="vlabel">Variations</span>
  <button data-scene="a" aria-selected="true">A · Refined</button>
  <button data-scene="b" aria-selected="false">B · Today-first</button>
  <button data-scene="c" aria-selected="false">C · Tasks</button>
  <button data-scene="d" aria-selected="false">D · Pulse</button>
</nav>

<!-- Scenes -->
<section class="scene active" id="scene-a" data-screen-label="01 Refined 3-pane"></section>
<section class="scene" id="scene-b" data-screen-label="02 Today-first"></section>
<section class="scene" id="scene-c" data-screen-label="03 Tasks (GTD)"></section>
<section class="scene" id="scene-d" data-screen-label="04 GTD Pulse"></section>

<!-- Tweak panel -->
<aside class="tweak-panel" id="tweakPanel" aria-label="Tweaks">
  <div class="tweak-header">
    <h3>Tweaks</h3>
    <button id="tweakClose" style="color:var(--text-3); font-size:16px; line-height:1;">×</button>
  </div>
  <div class="tweak-body">
    <div class="tweak-row">
      <label>Theme</label>
      <div class="seg" data-tweak="theme">
        <button data-val="dark">Dark</button>
        <button data-val="light">Light</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>Density</label>
      <div class="seg" data-tweak="density">
        <button data-val="compact">Compact</button>
        <button data-val="comfortable">Comfort</button>
        <button data-val="spacious">Spacious</button>
      </div>
    </div>
    <div class="tweak-row">
      <label>List style</label>
      <div class="seg" data-tweak="listStyle">
        <button data-val="rows">Rows</button>
        <button data-val="cards">Cards</button>
        <button data-val="threaded">Threaded</button>
      </div>
    </div>
  </div>
</aside>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="redesign/data.jsx"></script>
<script type="text/babel" src="redesign/icons.jsx"></script>
<script type="text/babel" src="redesign/common.jsx"></script>
<script type="text/babel" src="redesign/scene-a.jsx"></script>
<script type="text/babel" src="redesign/scene-b.jsx"></script>
<script type="text/babel" src="redesign/scene-c.jsx"></script>
<script type="text/babel" src="redesign/scene-d.jsx"></script>
<script type="text/babel" src="redesign/boot.jsx"></script>

<script>
/* ========= TWEAKS (editable defaults, persisted) ========= */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "comfortable",
  "listStyle": "cards",
  "variation": "d"
}/*EDITMODE-END*/;

const state = { ...TWEAK_DEFAULTS };

function applyState() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-density', state.density);
  document.documentElement.setAttribute('data-liststyle', state.listStyle);

  document.querySelectorAll('.variation-bar button[data-scene]').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.scene === state.variation ? 'true' : 'false');
  });
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById('scene-' + state.variation)?.classList.add('active');

  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.tweak;
    seg.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', b.dataset.val === state[key] ? 'true' : 'false');
    });
  });
}

function setTweak(key, val) {
  state[key] = val;
  applyState();
  window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
}

document.querySelectorAll('.variation-bar button[data-scene]').forEach(b => {
  b.addEventListener('click', () => setTweak('variation', b.dataset.scene));
});
document.querySelectorAll('.seg').forEach(seg => {
  const key = seg.dataset.tweak;
  seg.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => setTweak(key, b.dataset.val));
  });
});

/* Edit-mode integration */
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if (d.type === '__activate_edit_mode') document.getElementById('tweakPanel').classList.add('open');
  if (d.type === '__deactivate_edit_mode') document.getElementById('tweakPanel').classList.remove('open');
});
document.getElementById('tweakClose').addEventListener('click', () => {
  document.getElementById('tweakPanel').classList.remove('open');
});
window.parent?.postMessage({ type: '__edit_mode_available' }, '*');

applyState();
</script>

</body>
</html>
